<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOWNET // secure_channel</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root{
    --bg: #060a07;
    --panel: #0b120c;
    --green: #33ff77;
    --green-dim: #1c8f4a;
    --green-faint: #0e4a27;
    --amber: #ffb000;
    --red: #ff3b4e;
    --mono: 'Share Tech Mono', monospace;
    --display: 'VT323', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--green);
    font-family: var(--mono);
    overflow:hidden;
    transition: background .3s ease, color .3s ease;
  }

  .crt{ position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.0) 0px, rgba(0,0,0,0.15) 1px, rgba(0,0,0,0.0) 2px);
    mix-blend-mode: multiply; }
  .vignette{ position:fixed; inset:0; pointer-events:none; z-index:49;
    box-shadow: inset 0 0 160px rgba(0,0,0,0.75); }
  @keyframes flicker{ 0%,97%,100%{opacity:1;} 98%{opacity:0.86;} 99%{opacity:0.94;} }
  #app{ animation: flicker 6s infinite; height:100%; }

  @keyframes shake{
    0%,100%{ transform: translate(0,0); }
    20%{ transform: translate(-4px,3px); }
    40%{ transform: translate(4px,-3px); }
    60%{ transform: translate(-3px,-2px); }
    80%{ transform: translate(3px,2px); }
  }
  #app.shaking{ animation: flicker 6s infinite, shake .35s linear 3; }

  @keyframes staticburst{ 0%{opacity:0;} 15%{opacity:.85;} 100%{opacity:0;} }
  #staticOverlay{
    position:fixed; inset:0; z-index:60; pointer-events:none; opacity:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 2px, rgba(0,0,0,0.1) 2px 4px);
  }
  #staticOverlay.burst{ animation: staticburst .35s ease; }

  .wrap{ max-width: 900px; margin: 0 auto; height: 100%; display:flex; flex-direction:column; padding: 18px 18px 0 18px; }

  .titlebar{ display:flex; align-items:center; justify-content:space-between;
    border: 1px solid var(--green-faint); border-bottom:none;
    padding: 6px 12px; font-size: 13px; letter-spacing: 1px; color: var(--green-dim);
    background: linear-gradient(180deg, #0d150e, #090e0a); }
  .dots{ display:flex; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; background: var(--green-faint); }

  .sysstrip{ font-size: 11px; color: var(--green-faint); letter-spacing: .5px; }

  .ascii{ font-family: var(--display); font-size: 15px; line-height: 1.05; color: var(--green);
    text-shadow: 0 0 6px rgba(51,255,119,0.5); white-space: pre;
    padding: 10px 14px 4px; border: 1px solid var(--green-faint); border-top:none; border-bottom:none;
    overflow: hidden; transition: max-height .25s ease, padding .25s ease, opacity .2s ease;
    max-height: 220px; opacity: 1; }
  .ascii.collapsed{ max-height: 0; padding-top:0; padding-bottom:0; opacity: 0; border-width: 0; }
  .cipherline{ font-size: 11px; color: var(--green-faint); padding: 0 14px 8px; border: 1px solid var(--green-faint);
    border-top:none; border-bottom:none; letter-spacing: 1px; }
  .cipherline.collapsed{ display:none; }

  .screen{ flex:1; border: 1px solid var(--green-faint); border-top: none;
    background: radial-gradient(ellipse at top, #0c150d 0%, var(--panel) 60%);
    display:flex; flex-direction:column; min-height:0; position:relative; }

  #gate{ flex:1; display:flex; align-items:center; justify-content:center; padding: 20px; overflow-y:auto; }
  .gate-box{ width: 100%; max-width: 500px; }
  .gate-line{ margin: 0 0 10px; font-size: 15px; color: var(--green-dim); }
  .gate-line b{ color: var(--green); font-weight:normal; }
  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size:12px; color: var(--green-dim); margin-bottom: 4px; letter-spacing: 1px; }
  .field input{ width:100%; background: #061007; border: 1px solid var(--green-dim); color: var(--green);
    font-family: var(--mono); font-size: 15px; padding: 9px 10px; outline: none; }
  .field input:focus{ border-color: var(--green); box-shadow: 0 0 8px rgba(51,255,119,0.35); }
  .btnrow{ display:flex; gap:10px; margin-top: 6px; flex-wrap: wrap; }
  button.term-btn{ background: transparent; border: 1px solid var(--green); color: var(--green);
    font-family: var(--mono); font-size: 14px; padding: 9px 16px; cursor:pointer; letter-spacing: 1px; }
  button.term-btn:hover{ background: rgba(51,255,119,0.1); }
  .hint{ font-size:12px; color: var(--green-faint); margin-top:14px; line-height:1.5; }
  .err{ color: var(--red); font-size: 13px; min-height: 18px; margin-top: 6px; }

  .swatches{ display:flex; gap:8px; flex-wrap: wrap; }
  .swatch{ width: 26px; height: 26px; border-radius: 50%; cursor:pointer; border: 2px solid transparent; box-shadow: 0 0 4px rgba(0,0,0,0.6); }
  .swatch.selected{ border-color: #fff; }
  .glyphrow, .skinrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .glyph-opt{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:17px;
    border: 1px solid var(--green-faint); cursor:pointer; background:#061007; }
  .glyph-opt.selected{ border-color: var(--green); box-shadow: 0 0 6px rgba(51,255,119,.4); }
  .skin-opt{ padding: 6px 10px; border: 1px solid var(--green-faint); cursor:pointer; font-size:12px; background:#061007; color: var(--green-dim); }
  .skin-opt.selected{ border-color: var(--green); color: var(--green); }

  #chatview{ display:none; flex-direction:column; flex:1; min-height:0; }
  .statusbar{ display:flex; justify-content:space-between; align-items:center;
    padding: 6px 14px; font-size: 12px; color: var(--green-dim);
    border-bottom: 1px solid var(--green-faint); flex-wrap: wrap; gap: 6px; position:relative; }
  .statusbar .room{ color: var(--amber); }
  .statusbar .leave{ color: var(--red); cursor:pointer; text-decoration: underline; background:none; border:none; font-family:var(--mono); font-size:12px; }
  .statusbar .rightside{ display:flex; align-items:center; gap: 12px; flex-wrap:wrap; }
  .online-btn{ background:none; border: 1px solid var(--green-faint); color: var(--green-dim);
    font-family: var(--mono); font-size: 12px; padding: 3px 9px; cursor:pointer; position:relative; }
  .online-btn:hover{ border-color: var(--green); color: var(--green); }
  .online-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--green); margin-right:5px; box-shadow: 0 0 4px var(--green); }
  .uptime{ font-size: 11px; color: var(--green-faint); }

  .online-panel{ display:none; position:absolute; top: 32px; right: 14px; z-index: 20;
    background: #081409; border: 1px solid var(--green-faint); min-width: 220px;
    padding: 8px 0; max-height: 280px; overflow-y:auto; }
  .online-panel.open{ display:block; }
  .online-item{ padding: 6px 12px; font-size: 13px; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .online-item .left{ display:flex; align-items:center; gap:8px; }
  .online-item .meta{ color: var(--green-faint); font-size: 10px; }
  .online-empty{ padding: 6px 12px; font-size: 12px; color: var(--green-faint); }
  .panel-divider{ padding: 4px 12px; font-size: 10px; color: var(--green-faint); text-transform: uppercase; letter-spacing:1px; }

  #log{ flex:1; overflow-y: auto; padding: 14px; font-size: 14px; line-height: 1.55; position:relative; }
  #log::-webkit-scrollbar{ width: 8px; }
  #log::-webkit-scrollbar-thumb{ background: var(--green-faint); }

  .msg{ margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; position:relative; }
  .msg.highlight{ outline: 1px solid var(--amber); background: rgba(255,176,0,0.08); }
  .msg .ts{ color: var(--green-faint); margin-right:8px; }
  .msg .who{ margin-right:2px; }
  .msg .body{ color: var(--green); }
  .msg .edited-tag{ color: var(--green-faint); font-size: 11px; margin-left:6px; }
  .msg .whisper-tag{ color: var(--amber); font-size: 11px; margin-right:6px; }
  .msg .rank-tag{ font-size: 10px; color: var(--green-faint); margin-right:4px; }
  .sys{ color: var(--green-dim); font-style: normal; }
  .sys .prefix{ color: var(--red); }
  .sys.alertline{ color: var(--red); }
  .deleted-tag{ color: var(--green-faint); font-style: italic; }
  .art-block{ display:block; white-space: pre; font-family: var(--mono); margin-top: 2px; color: var(--amber); }

  .msg-actions{ margin-left: 8px; font-size: 11px; }
  .msg-actions a{ color: var(--green-faint); cursor:pointer; text-decoration: underline; margin-right: 6px; }
  .msg-actions a:hover{ color: var(--green); }
  .msg-actions a.danger:hover{ color: var(--red); }

  .edit-box{ display:flex; gap:6px; margin-top:4px; }
  .edit-box input{ flex:1; background:#061007; border: 1px solid var(--green-dim); color: var(--green);
    font-family: var(--mono); font-size: 13px; padding: 5px 8px; outline:none; }
  .edit-box button{ background:none; border: 1px solid var(--green-dim); color: var(--green-dim);
    font-family: var(--mono); font-size: 12px; padding: 4px 8px; cursor:pointer; }
  .edit-box button:hover{ color: var(--green); border-color: var(--green); }

  .typing-line{ padding: 2px 14px; font-size: 12px; color: var(--green-faint); min-height: 18px; font-style: italic; }

  .inputrow{ display:flex; align-items:center; gap:8px; border-top: 1px solid var(--green-faint); padding: 10px 14px 14px; }
  .prompt-sym{ color: var(--amber); font-size:15px; }
  #msgInput{ flex:1; background: transparent; border: none; outline: none; color: var(--green);
    font-family: var(--mono); font-size: 15px; caret-color: var(--green); }
  #msgInput::placeholder{ color: var(--green-faint); }
  .charcount{ font-size: 11px; color: var(--green-faint); min-width: 54px; text-align:right; }
  .charcount.warn{ color: var(--amber); }
  .charcount.over{ color: var(--red); }
  .send-btn{ background: transparent; border: 1px solid var(--green-dim); color: var(--green-dim);
    font-family: var(--mono); padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .send-btn:hover{ border-color: var(--green); color: var(--green); }

  .boot{ padding: 14px; font-size: 13px; color: var(--green-dim); white-space: pre-wrap; transition: opacity .2s ease, max-height .25s ease; overflow:hidden; }
  .boot.collapsed{ max-height:0; padding:0; opacity:0; }
  .cursor-blink{ display:inline-block; width:8px; height:14px; background: var(--green); animation: blink 1s step-start infinite; vertical-align: -2px; }
  @keyframes blink{ 50%{ opacity:0; } }

  #matrixCanvas{ position:fixed; inset:0; z-index: 40; display:none; background: #000; }

  @media (max-width: 600px){
    .ascii{ font-size: 10px; }
    .wrap{ padding: 8px 8px 0; }
    .online-panel{ right: 8px; left: 8px; min-width: unset; }
    .sysstrip{ display:none; }
    .typing-line{ font-size: 10px; }
    .uptime{ display:none; }
  }
</style>
</head>
<body>

<div class="crt"></div>
<div class="vignette"></div>
<div id="staticOverlay"></div>
<canvas id="matrixCanvas"></canvas>

<div id="app">
<div class="wrap">
  <div class="titlebar">
    <span>root@shadownet:~$</span>
    <span class="sysstrip" id="sysStrip">CPU 00% · SIG ▯▯▯▯ · PING 0ms</span>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
  <div class="ascii" id="asciiArt"></div>
  <div class="cipherline" id="cipherLine"></div>

  <div class="screen">
    <div id="boot" class="boot"></div>

    <div id="gate">
      <div class="gate-box">
        <p class="gate-line">&gt; enter a <b>channel code</b> — anyone with this code can join this room.</p>
        <div class="field">
          <label>CHANNEL CODE</label>
          <input id="roomInput" type="text" placeholder="e.g. midnight-owls" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label>YOUR CODENAME</label>
          <input id="nameInput" type="text" placeholder="e.g. ghost" autocomplete="off" spellcheck="false" maxlength="16" />
        </div>
        <div class="field">
          <label>NAME COLOR</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="field">
          <label>AVATAR</label>
          <div class="glyphrow" id="glyphRow"></div>
        </div>
        <div class="field">
          <label>TERMINAL SKIN</label>
          <div class="skinrow" id="skinRow"></div>
        </div>
        <div class="btnrow">
          <button class="term-btn" id="connectBtn">CONNECT ▸</button>
        </div>
        <div class="err" id="gateErr"></div>
        <p class="hint">// not encrypted end-to-end — good for friend chat, not state secrets. type /help once connected for the full command list.</p>
      </div>
    </div>

    <div id="chatview">
      <div class="statusbar">
        <span>CH: <span class="room" id="roomLabel"></span> | YOU: <span id="nameLabel"></span> <span class="uptime" id="uptimeLabel"></span></span>
        <div class="rightside">
          <button class="online-btn" id="onlineBtn"><span class="online-dot"></span><span id="onlineCount">0</span> online</button>
          <button class="leave" id="leaveBtn">disconnect</button>
        </div>
        <div class="online-panel" id="onlinePanel"></div>
      </div>
      <div id="log"></div>
      <div class="typing-line" id="typingLine"></div>
      <div class="inputrow">
        <span class="prompt-sym">&gt;</span>
        <input id="msgInput" type="text" maxlength="500" placeholder="type a message... (/help for commands)" autocomplete="off" spellcheck="false" />
        <span class="charcount" id="charCount">0/500</span>
        <button class="send-btn" id="sendBtn">SEND</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const asciiText = String.raw`
 ███████╗██╗  ██╗ █████╗ ██████╗  ██████╗ ██╗    ██╗███╗   ██╗███████╗████████╗
 ██╔════╝██║  ██║██╔══██╗██╔══██╗██╔═══██╗██║    ██║████╗  ██║██╔════╝╚══██╔══╝
 ███████╗███████║███████║██║  ██║██║   ██║██║ █╗ ██║██╔██╗ ██║█████╗     ██║
 ╚════██║██╔══██║██╔══██║██║  ██║██║   ██║██║███╗██║██║╚██╗██║██╔══╝     ██║
 ███████║██║  ██║██║  ██║██████╔╝╚██████╔╝╚███╔███╔╝██║ ╚████║███████╗   ██║
 ╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═════╝  ╚═════╝  ╚══╝╚══╝ ╚═╝  ╚═══╝╚══════╝   ╚═╝
`;
document.getElementById('asciiArt').textContent = asciiText;

// ============================================================
// FIREBASE
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBRekxAMuYCscALbAYBadXoLOKuVS_KhnM",
  authDomain: "shadownet-57c8b.firebaseapp.com",
  projectId: "shadownet-57c8b",
  storageBucket: "shadownet-57c8b.firebasestorage.app",
  messagingSenderId: "84120870472",
  appId: "1:84120870472:web:73338b32f429aa131f027d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ============================================================
// STATIC DATA
// ============================================================
const ART = {
  shrug: "¯\\_(ツ)_/¯", flip: "(╯°□°)╯︵ ┻━┻", unflip: "┬─┬ ノ( ゜-゜ノ)",
  fire: "  (  .      )\n )     (   ) )\n(  (  )   )\n_______)_",
  heart: "  ██  ██  \n████████\n ██████ \n  ████  \n   ██   ",
  skull: " .-\"\"\"\"-.\n/ .--..--\\.\n| |  ||  |\n| |__||__|\n\\  .--.  /\n \\ '--' /\n  '----'",
  rocket: "     /\\\n    /  \\\n   |----|\n   |SHDW|\n   |----|\n  /|    |\\\n / |    | \\\n   /|  |\\\n  ' |  | '\n     ||",
  party: "\\o/  \\o/  \\o/\n | \\  |  /  |\n/ \\  / \\  / \\",
  coffee: "   ( (\n    ) )\n  ........\n  |      |]\n  \\      /\n   `----'",
  wave: "  o/\n /|\n/ \\",
  ghost: " .-\"\"\"-.\n/       \\\n|  o o  |\n|   ^   |\n \\_____/\n / / \\ \\\n/_/   \\_\\"
};
const ART_HELP = Object.keys(ART).map(k => '/'+k).join('  ');

const COLORS = [
  {name:'green',hex:'#33ff77'},{name:'amber',hex:'#ffb000'},{name:'red',hex:'#ff5566'},
  {name:'cyan',hex:'#3df0ff'},{name:'magenta',hex:'#ff5ce0'},{name:'blue',hex:'#5b9bff'},
  {name:'white',hex:'#f0f0f0'},{name:'lime',hex:'#b6ff3d'}
];

const AVATARS = ['🙂','💀','🤖','👻','👽','🥷','🛸','🐺'];

const SKINS = {
  green: {bg:'#060a07',panel:'#0b120c',green:'#33ff77',dim:'#1c8f4a',faint:'#0e4a27',amber:'#ffb000'},
  amber: {bg:'#0a0805',panel:'#120e09',green:'#ffb000',dim:'#8f5a1c',faint:'#4a3010',amber:'#ff7a3f'},
  blue:  {bg:'#060810',panel:'#0b0f1a',green:'#4fc3ff',dim:'#1c5f8f',faint:'#0e2c4a',amber:'#7be0ff'},
  red:   {bg:'#0a0606',panel:'#150909',green:'#ff4f5e',dim:'#8f1c26',faint:'#4a0e13',amber:'#ff9d3f'},
  mono:  {bg:'#050505',panel:'#0d0d0d',green:'#e8e8e8',dim:'#8a8a8a',faint:'#3a3a3a',amber:'#ffffff'}
};

const CIPHER_WORDS = ['NIGHTSHADE','OBSIDIAN','WHISPERGATE','BLACKGLASS','VANTABLACK','GRAYFROST','SILENTECHO','IRONVEIL','DUSKWIRE','COLDCIPHER','EMBERLOCK','VOIDSIGNAL'];

const RANKS = [
  {min:0, tag:'recruit'}, {min:15, tag:'operative'}, {min:50, tag:'ghost'}, {min:150, tag:'phantom'}
];

const PROFANITY = ['damn','hell','crap']; // mild placeholder blacklist, off by default

// ============================================================
// STATE
// ============================================================
let ROOM=null, NAME=null, MY_COLOR=COLORS[0].hex, MY_AVATAR=AVATARS[0], SESSION_ID=null;
let msgUnsub=null, presenceUnsub=null, typingUnsub=null, deadmanUnsub=null;
let heartbeatTimer=null, typingClearTimer=null, uptimeTimer=null, sysStripTimer=null, idleTimer=null;
let onlinePanelOpen=false, pendingDelete=null;
let msgHistory=[], historyIndex=-1;
let sendTimestamps=[];
let filterOn=false;
let unreadCount=0, baseTitle='SHADOWNET // secure_channel';
let roomCreatedAt=null;
let matrixActive=false, matrixRAF=null;
let myMsgCount=0;

// DOM refs
const gateErr=document.getElementById('gateErr'), roomInput=document.getElementById('roomInput'),
  nameInput=document.getElementById('nameInput'), connectBtn=document.getElementById('connectBtn'),
  gate=document.getElementById('gate'), chatview=document.getElementById('chatview'),
  roomLabel=document.getElementById('roomLabel'), nameLabel=document.getElementById('nameLabel'),
  logEl=document.getElementById('log'), msgInput=document.getElementById('msgInput'),
  sendBtn=document.getElementById('sendBtn'), leaveBtn=document.getElementById('leaveBtn'),
  asciiArt=document.getElementById('asciiArt'), bootEl0=document.getElementById('boot'),
  onlineBtn=document.getElementById('onlineBtn'), onlineCount=document.getElementById('onlineCount'),
  onlinePanel=document.getElementById('onlinePanel'), typingLine=document.getElementById('typingLine'),
  swatchesEl=document.getElementById('swatches'), glyphRow=document.getElementById('glyphRow'),
  skinRow=document.getElementById('skinRow'), cipherLine=document.getElementById('cipherLine'),
  uptimeLabel=document.getElementById('uptimeLabel'), sysStrip=document.getElementById('sysStrip'),
  charCount=document.getElementById('charCount'), staticOverlay=document.getElementById('staticOverlay'),
  appEl=document.getElementById('app'), matrixCanvas=document.getElementById('matrixCanvas');

// ---------- gate pickers ----------
COLORS.forEach((c,i)=>{
  const s=document.createElement('div');
  s.className='swatch'+(i===0?' selected':'');
  s.style.background=c.hex; s.dataset.hex=c.hex; s.title=c.name;
  s.addEventListener('click',()=>{ document.querySelectorAll('.swatch').forEach(e=>e.classList.remove('selected')); s.classList.add('selected'); MY_COLOR=c.hex; });
  swatchesEl.appendChild(s);
});
AVATARS.forEach((g,i)=>{
  const d=document.createElement('div');
  d.className='glyph-opt'+(i===0?' selected':'');
  d.textContent=g;
  d.addEventListener('click',()=>{ document.querySelectorAll('.glyph-opt').forEach(e=>e.classList.remove('selected')); d.classList.add('selected'); MY_AVATAR=g; });
  glyphRow.appendChild(d);
});
Object.keys(SKINS).forEach((name,i)=>{
  const d=document.createElement('div');
  d.className='skin-opt'+(i===0?' selected':'');
  d.textContent=name;
  d.addEventListener('click',()=>{ document.querySelectorAll('.skin-opt').forEach(e=>e.classList.remove('selected')); d.classList.add('selected'); applySkin(name); });
  skinRow.appendChild(d);
});
function applySkin(name){
  const s=SKINS[name]||SKINS.green;
  const r=document.documentElement.style;
  r.setProperty('--bg',s.bg); r.setProperty('--panel',s.panel); r.setProperty('--green',s.green);
  r.setProperty('--green-dim',s.dim); r.setProperty('--green-faint',s.faint); r.setProperty('--amber',s.amber);
}

// ---------- cipher word of the day ----------
(function(){
  const start=new Date(new Date().getFullYear(),0,0);
  const diff=new Date()-start;
  const dayOfYear=Math.floor(diff/86400000);
  const word=CIPHER_WORDS[dayOfYear % CIPHER_WORDS.length];
  cipherLine.textContent='.oO CODEWORD OF THE DAY: '+word+' Oo.';
})();

// ---------- boot sequence ----------

// ---------- helpers ----------
function slug(s){ return s.trim().toLowerCase().replace(/[^a-z0-9\-_]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''); }
function fmtTime(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function makeSessionId(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }
function rankFor(count){ let tag='recruit'; for(const r of RANKS){ if(count>=r.min) tag=r.tag; } return tag; }
function applyFilter(text){
  if(!filterOn) return text;
  let out=text;
  PROFANITY.forEach(w=>{ out=out.replace(new RegExp('\\b'+w+'\\b','gi'), '█'.repeat(w.length)); });
  return out;
}

async function pushMessage(entry){
  try{
    await messagesRef().add({ name:NAME, color:MY_COLOR, avatar:MY_AVATAR, ts:Date.now(), edited:false, deleted:false, ...entry });
    roomRef().set({ lastActivity: Date.now() }, {merge:true});
    myMsgCount++;
  }catch(e){ addSystemLine('connection error — message may not have sent.'); console.error(e); }
}
async function pushSys(text, alert){
  try{ await messagesRef().add({ sys:true, text, ts:Date.now(), alert: !!alert }); roomRef().set({lastActivity:Date.now()},{merge:true}); }catch(e){}
}

function renderMessages(docs){
  logEl.innerHTML='';
  docs.forEach(({id,data:m})=>{
    const div=document.createElement('div');
    if(m.sys){
      div.className='msg sys'+(m.alert?' alertline':'');
      div.innerHTML='<span class="prefix">[sys]</span> '+escapeHTML(m.text);
      logEl.appendChild(div); return;
    }
    if(m.whisperTo && m.whisperTo!==NAME && m.name!==NAME) return;
    if(m.deleted){
      div.className='msg';
      div.innerHTML='<span class="ts">'+fmtTime(m.ts)+'</span><span class="deleted-tag">'+escapeHTML(m.name)+' deleted a message</span>';
      logEl.appendChild(div); return;
    }
    div.className='msg'; div.dataset.id=id;
    const nameColor=m.color||'#33ff77';
    const avatar=m.avatar?escapeHTML(m.avatar)+' ':'';
    const whisperTag=m.whisperTo?'<span class="whisper-tag">(whisper to '+escapeHTML(m.whisperTo)+')</span>':'';
    let bodyHTML;
    if(m.art){ bodyHTML='<span class="body">'+escapeHTML(m.text||'')+'</span><span class="art-block">'+escapeHTML(m.art)+'</span>'; }
    else{ bodyHTML='<span class="body">'+escapeHTML(m.text)+'</span>'; }
    const editedTag=m.edited?'<span class="edited-tag">(edited)</span>':'';
    let actions='';
    if(m.name===NAME){ actions='<span class="msg-actions"><a class="edit-act" data-id="'+id+'">edit</a><a class="del-act danger" data-id="'+id+'">delete</a></span>'; }
    div.innerHTML='<span class="ts">'+fmtTime(m.ts)+'</span>'+whisperTag+
      '<span class="who" style="color:'+nameColor+'">'+avatar+escapeHTML(m.name)+'&gt;</span> '+bodyHTML+editedTag+actions;
    logEl.appendChild(div);
  });
  logEl.scrollTop=logEl.scrollHeight;
}

async function initUptime(){
  const doc=await roomRef().get();
  const data=doc.exists?doc.data():{};
  if(!data.createdAt){ await roomRef().set({createdAt:Date.now(), lastActivity:Date.now()},{merge:true}); roomCreatedAt=Date.now(); }
  else{ roomCreatedAt=data.createdAt; }
  uptimeTimer=setInterval(()=>{
    const secs=Math.floor((Date.now()-roomCreatedAt)/1000);
    const h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
    uptimeLabel.textContent='| UPTIME '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },1000);
  return data;
}

async function checkAutoExpiry(data){
  const last=data.lastActivity||data.createdAt||Date.now();
  if(Date.now()-last > 48*3600*1000){
    const snap=await messagesRef().get();
    const batch=db.batch();
    snap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    await roomRef().set({createdAt:Date.now(), lastActivity:Date.now()},{merge:true});
    roomCreatedAt=Date.now();
    await pushSys('channel auto-purged after 48h of inactivity. fresh start.');
  }
}

function showHelp(){
  addSystemLine('basics: /help /clear /nick <name> /color <name> /avatar /whoami');
  addSystemLine('social: /w <name> <msg>  /find <keyword>  /afk  /status <text>  /export');
  addSystemLine('fun: /roll <n>  /flip  /game guess  /guess <n>  /verify <name>  /alert  /deadman <hrs> <msg>  /checkin');
  addSystemLine('art: '+ART_HELP);
  addSystemLine('color names: '+COLORS.map(c=>c.name).join(', '));
}

async function handleCommand(raw){
  const parts=raw.slice(1).split(' ');
  const cmd=parts[0].toLowerCase();

  if(ART[cmd]){ await pushMessage({text:'', art:ART[cmd]}); return; }
  if(cmd==='help'){ showHelp(); return; }
  if(cmd==='whoami'){ addSystemLine('you are '+NAME+' in channel "'+ROOM+'". rank: '+rankFor(myMsgCount)+' ('+myMsgCount+' msgs)'); return; }
  if(cmd==='clear'){ logEl.innerHTML=''; return; }

  if(cmd==='nick'){
    const newName=parts.slice(1).join(' ').trim();
    if(!newName){ addSystemLine('usage: /nick <new codename>'); return; }
    const old=NAME; NAME=newName.slice(0,16); nameLabel.textContent=NAME;
    await pushSys(old+' is now known as '+NAME);
    return;
  }
  if(cmd==='color'){
    const wanted=(parts[1]||'').toLowerCase(); const found=COLORS.find(c=>c.name===wanted);
    if(!found){ addSystemLine('usage: /color <'+COLORS.map(c=>c.name).join('|')+'>'); return; }
    MY_COLOR=found.hex; addSystemLine('name color set to '+found.name+'.'); return;
  }
  if(cmd==='avatar'){
    const i=AVATARS.indexOf(MY_AVATAR); MY_AVATAR=AVATARS[(i+1)%AVATARS.length];
    addSystemLine('avatar changed to '+MY_AVATAR); return;
  }
  if(cmd==='afk'){
    presenceRef().doc(SESSION_ID).set({status:'afk'},{merge:true});
    addSystemLine('marked as afk.'); return;
  }
  if(cmd==='status'){
    const st=parts.slice(1).join(' ').trim()||'online';
    presenceRef().doc(SESSION_ID).set({status:st},{merge:true});
    addSystemLine('status set.'); return;
  }
  if(cmd==='w'){
    const target=parts[1]; const text=parts.slice(2).join(' ').trim();
    if(!target||!text){ addSystemLine('usage: /w <name> <message>'); return; }
    await pushMessage({text, whisperTo:target});
    return;
  }
  if(cmd==='find'){
    const kw=parts.slice(1).join(' ').trim().toLowerCase();
    if(!kw){ addSystemLine('usage: /find <keyword>'); return; }
    const all=logEl.querySelectorAll('.msg'); let found=null;
    all.forEach(el=>el.classList.remove('highlight'));
    for(const el of all){ if(el.textContent.toLowerCase().includes(kw)) found=el; }
    if(found){ found.classList.add('highlight'); found.scrollIntoView({block:'center'}); setTimeout(()=>found.classList.remove('highlight'),2500); }
    else addSystemLine('no matches for "'+kw+'".');
    return;
  }
  if(cmd==='export'){
    const lines=[...logEl.querySelectorAll('.msg')].map(el=>el.textContent);
    const blob=new Blob([lines.join('\n')], {type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='shadownet_'+ROOM+'_transmission.txt'; a.click();
    addSystemLine('log exported.'); return;
  }
  if(cmd==='roll'){
    const n=parseInt(parts[1])||100;
    await pushMessage({text:NAME+' rolled '+(Math.floor(Math.random()*n)+1)+' (out of '+n+')'});
    return;
  }
  if(cmd==='flip'){
    await pushMessage({text:NAME+' flipped a coin: '+(Math.random()<0.5?'HEADS':'TAILS')});
    return;
  }
  if(cmd==='game'){
    if((parts[1]||'').toLowerCase()==='guess'){
      const target=Math.floor(Math.random()*100)+1;
      await gameRef().set({type:'guess', target, active:true, startedBy:NAME, startedAt:Date.now()});
      await pushSys(NAME+' started a number-guessing game (1-100). type /guess <number> to play.');
    } else addSystemLine('usage: /game guess');
    return;
  }
  if(cmd==='guess'){
    const n=parseInt(parts[1]);
    if(isNaN(n)){ addSystemLine('usage: /guess <number>'); return; }
    const doc=await gameRef().get();
    if(!doc.exists || !doc.data().active){ addSystemLine('no active game. start one with /game guess'); return; }
    const target=doc.data().target;
    if(n===target){ await gameRef().update({active:false}); await pushSys(NAME+' guessed it! the number was '+target+'.'); }
    else await pushMessage({text:NAME+' guessed '+n+' — '+(n<target?'too low':'too high')});
    return;
  }
  if(cmd==='verify'){
    const target=parts[1];
    if(!target){ addSystemLine('usage: /verify <name>'); return; }
    const h=Math.abs(simpleHash(ROOM+'::'+[NAME,target].sort().join('::'))).toString(16).toUpperCase().padStart(12,'0');
    const formatted=h.match(/.{1,4}/g).join('-');
    addSystemLine('fingerprint for you <-> '+target+': '+formatted+' (read this aloud to confirm you\'re both seeing the same code)');
    return;
  }
  if(cmd==='alert'){
    appEl.classList.add('shaking'); staticOverlay.classList.add('burst');
    setTimeout(()=>{ appEl.classList.remove('shaking'); staticOverlay.classList.remove('burst'); },700);
    await pushSys(NAME+' triggered a system alert.', true);
    return;
  }
  if(cmd==='deadman'){
    const hrs=parseFloat(parts[1]); const msg=parts.slice(2).join(' ').trim();
    if(!hrs||!msg){ addSystemLine('usage: /deadman <hours> <message>'); return; }
    await deadmanRef().doc(SESSION_ID).set({name:NAME, message:msg, triggerAt:Date.now()+hrs*3600000, delivered:false});
    addSystemLine('dead man\'s switch armed. check in with /checkin, or it auto-sends in '+hrs+'h (only while someone has this room open in a browser).');
    return;
  }
  if(cmd==='checkin'){
    await deadmanRef().doc(SESSION_ID).delete().catch(()=>{});
    addSystemLine('checked in — dead man\'s switch disarmed.');
    return;
  }
  if(cmd==='filter'){
    const on=(parts[1]||'').toLowerCase();
    if(on==='on'){ filterOn=true; addSystemLine('profanity filter on.'); }
    else if(on==='off'){ filterOn=false; addSystemLine('profanity filter off.'); }
    else addSystemLine('usage: /filter on|off');
    return;
  }
  addSystemLine('unknown command: /'+cmd+' (try /help)');
}

let lastRenderedCount=0;
function handleUnreadTracking(docs){
  const newCount=docs.length;
  if(newCount>lastRenderedCount && document.hidden){
    unreadCount += (newCount-lastRenderedCount);
    document.title='('+unreadCount+') '+baseTitle;
    playBeep();
  }
  lastRenderedCount=newCount;
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && unreadCount>0){
    addSystemLine(unreadCount+' new transmission'+(unreadCount>1?'s':'')+' while you were away.');
    unreadCount=0; document.title=baseTitle;
  }
});
let audioCtx=null;
function playBeep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.value=740; g.gain.value=0.03;
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.09);
  }catch(e){}
}

// ============================================================
function startMatrix(){
  matrixActive=true; matrixCanvas.style.display='block';
  const ctx=matrixCanvas.getContext('2d');
  matrixCanvas.width=window.innerWidth; matrixCanvas.height=window.innerHeight;
  const cols=Math.floor(matrixCanvas.width/14); const drops=new Array(cols).fill(0);
  const chars='アイウエオカキクケコサシスセソ0123456789';
  function draw(){
    ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(0,0,matrixCanvas.width,matrixCanvas.height);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--green')||'#33ff77';
    ctx.font='14px monospace';
    drops.forEach((y,i)=>{
      const ch=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(ch, i*14, y*14);
      if(y*14>matrixCanvas.height && Math.random()>0.975) drops[i]=0; else drops[i]=y+1;
    });
    matrixRAF=requestAnimationFrame(draw);
  }
  draw();
}
function stopMatrix(){
  matrixActive=false; matrixCanvas.style.display='none';
  if(matrixRAF) cancelAnimationFrame(matrixRAF);
}

// CONNECT / DISCONNECT
// ============================================================
async function connect(){
  gateErr.textContent='';
  const room=slug(roomInput.value), name=nameInput.value.trim().slice(0,16);
  if(!room){ gateErr.textContent='enter a channel code.'; return; }
  if(!name){ gateErr.textContent='enter a codename.'; return; }

  ROOM=room; NAME=name; SESSION_ID=makeSessionId();
  roomLabel.textContent=ROOM; nameLabel.textContent=NAME;

  gate.style.display='none'; chatview.style.display='flex';
  asciiArt.classList.add('collapsed'); bootEl0.classList.add('collapsed'); cipherLine.classList.add('collapsed');

  const meta=await initUptime();
  await checkAutoExpiry(meta);
  startMessageListener();
  startPresence();
  startTyping();
  startDeadmanWatch();
  scheduleScreenshotWarning();
  resetIdleTimer();
  await pushSys(NAME+' connected to the channel.');

  msgInput.focus();
}

async function disconnect(){
  await pushSys(NAME+' disconnected.');
  if(msgUnsub){ msgUnsub(); msgUnsub=null; }
  if(deadmanUnsub){ deadmanUnsub(); deadmanUnsub=null; }
  if(uptimeTimer){ clearInterval(uptimeTimer); uptimeTimer=null; }
  clearTimeout(idleTimer); stopMatrix();
  stopPresence(); stopTyping();
  chatview.style.display='none'; gate.style.display='flex';
  asciiArt.classList.remove('collapsed'); bootEl0.classList.remove('collapsed'); cipherLine.classList.remove('collapsed');
  gateErr.textContent='';
}

async function sendMessage(){
  const raw=msgInput.value;
  if(!raw.trim()) return;

  const now=Date.now();
  sendTimestamps=sendTimestamps.filter(t=>now-t<6000);
  if(sendTimestamps.length>=6){ addSystemLine('slow down — you\'re sending too fast.'); return; }
  sendTimestamps.push(now);

  msgInput.value=''; charCount.textContent='0/500'; charCount.classList.remove('warn','over');
  msgHistory.push(raw); historyIndex=msgHistory.length;
  clearTypingNow();

  if(raw.trim().startsWith('/')){ await handleCommand(raw.trim()); return; }
  await pushMessage({ text: applyFilter(raw) });
}

msgInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ sendMessage(); return; }
  if(e.key==='ArrowUp'){ if(historyIndex>0){ historyIndex--; msgInput.value=msgHistory[historyIndex]; } e.preventDefault(); }
  if(e.key==='ArrowDown'){ if(historyIndex<msgHistory.length-1){ historyIndex++; msgInput.value=msgHistory[historyIndex]; } else { historyIndex=msgHistory.length; msgInput.value=''; } e.preventDefault(); }
});
msgInput.addEventListener('input', ()=>{
  if(msgInput.value.trim()) notifyTyping(); else clearTypingNow();
  const len=msgInput.value.length;
  charCount.textContent=len+'/500';
  charCount.classList.toggle('warn', len>400 && len<=480);
  charCount.classList.toggle('over', len>480);
});
leaveBtn.addEventListener('click', disconnect);
window.addEventListener('beforeunload', ()=>{
  if(SESSION_ID){ typingRef().doc(SESSION_ID).delete().catch(()=>{}); }
});
</script>

</body>
